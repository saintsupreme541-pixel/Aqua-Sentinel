services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: aqua-sentinel-backend
    environment:
      AQUA_STORAGE_DIR: /data
      AQUA_SAMPLE_DATA: /workspace/data/samples
    volumes:
      - aqua-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: aqua-sentinel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  aqua-data:
