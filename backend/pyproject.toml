[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-sentinel-backend"
version = "0.1.0"
description = "AQUA-SENTINEL AI — sonar-aware marine debris intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "onnxruntime>=1.18",
    "reportlab>=4.1",
    "httpx>=0.27",
    "pyproj>=3.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "ultralytics>=8.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105",  # contextlib.suppress rewrites hurt readability here
]

# FastAPI idiom: File(...)/Form(...) defaults must be declared in the signature
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"  # numpy>=2.5 stubs use `type` statements
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true